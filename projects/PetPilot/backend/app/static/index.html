<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetPilot 临时验收界面</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f5f6f8; color: #1f2329; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    .hint { color: #888; font-size: 12px; margin-bottom: 12px; }
    .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d8dde3; border-radius: 6px; font-size: 14px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; font-size: 14px; cursor: pointer; }
    button.ghost { background: #eef1f5; color: #1f2329; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .row input { flex: 1; }
    .pet-tag { display: inline-block; background: #e8f0fe; color: #1a56db; border-radius: 4px; padding: 2px 8px; margin: 2px; font-size: 13px; }
    .msg { padding: 8px 0; border-bottom: 1px solid #f0f1f3; white-space: pre-wrap; font-size: 14px; }
    .msg.user { color: #1f2329; }
    .msg.assistant { color: #555; background: #fafbfc; border-radius: 6px; padding: 8px; }
    .fact { padding: 6px 8px; background: #f7f9fb; border-radius: 6px; margin: 4px 0; font-size: 13px; }
    .held { padding: 6px 8px; background: #fff8e6; border-radius: 6px; margin: 4px 0; font-size: 13px; }
    .err { color: #c00; font-size: 13px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>PetPilot · 临时验收界面</h1>
  <div class="hint">阶段 2-1 验收用，阶段 3 将换正式前端。验证码固定为 <b>123456</b>。</div>

  <div class="card" id="loginCard">
    <div class="row">
      <input id="code" placeholder="验证码" value="123456">
      <button onclick="login()">登录</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="card" id="appCard" style="display:none">
    <div class="row">
      <input id="petName" placeholder="新猫名字，如：明月">
      <button onclick="createPet()">建猫</button>
    </div>
    <div id="pets"></div>
  </div>

  <div class="card" id="chatCard" style="display:none">
    <textarea id="text" rows="2" placeholder="记录一句话，如：明月今天吃了 26 克，贝塔有点拉稀"></textarea>
    <div style="margin-top:8px"><button onclick="send()">发送</button></div>
    <div id="result" style="margin-top:10px"></div>
    <div style="margin-top:12px">
      <input type="file" id="photoFile" accept="image/*" style="width:auto">
      <input id="photoDesc" placeholder="照片描述（可选）">
      <button onclick="uploadPhoto()">上传照片</button>
    </div>
    <div style="margin-top:12px">
      <button class="ghost" onclick="loadHistory()">刷新历史</button>
      <button class="ghost" onclick="loadFacts()">查记录</button>
      <button class="ghost" onclick="loadHeld()">查挂起</button>
      <button class="ghost" onclick="loadReminders()">查提醒</button>
      <button class="ghost" onclick="loadPhotos()">查照片</button>
      <button class="ghost" onclick="loadCare()">查摘要</button>
    </div>
    <div id="history" style="margin-top:10px"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('petpilot_token') || '';
const $ = (id) => document.getElementById(id);
function api(path, opts = {}) {
  return fetch('/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) }
  }).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const err = data.error || { code: 'HTTP_ERROR', message: r.statusText };
      if (err.code === 'AUTH_REQUIRED') {
        token = ''; localStorage.removeItem('petpilot_token');
        showLogin();
        $('loginErr').textContent = '登录已失效，请重新登录';
      }
      throw err;
    }
    return data;
  });
}
function showLogin() {
  $('loginCard').style.display = 'block';
  $('appCard').style.display = 'none';
  $('chatCard').style.display = 'none';
}
function showApp() {
  $('loginCard').style.display = 'none';
  $('appCard').style.display = 'block';
  $('chatCard').style.display = 'block';
  loadPets(); loadHistory();
}
async function login() {
  $('loginErr').textContent = '';
  try {
    const data = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ code: $('code').value }) }).then(r => r.json());
    if (data.error) throw data.error;
    token = data.token; localStorage.setItem('petpilot_token', token); showApp();
  } catch (e) { $('loginErr').textContent = e.message || '登录失败'; }
}
async function createPet() {
  const name = $('petName').value.trim(); if (!name) return;
  await api('/pets', { method: 'POST', body: JSON.stringify({ name }) });
  $('petName').value = ''; loadPets();
}
async function loadPets() {
  const data = await api('/pets');
  $('pets').innerHTML = data.pets.map(p => `<span class="pet-tag">${p.id}. ${p.name}</span>`).join('') || '（还没有猫，先建一只）';
}
async function send() {
  const text = $('text').value.trim(); if (!text) return;
  $('result').innerHTML = '';
  try {
    const data = await api('/messages', { method: 'POST', body: JSON.stringify({ text }) });
    $('result').innerHTML =
      `<div class="fact"><b>回执：</b>${data.receipt}</div>` +
      data.facts.map(f => `<div class="fact">✅ 归档到「${f.pet_name}」：${f.topic || ''}${f.value != null ? ' ' + f.value : ''}${f.unit || ''}（出处：${f.quote}）</div>`).join('') +
      data.corrections.map(c => `<div class="fact">✏️ ${c.status === 'conflict' ? '纠错冲突：' + c.message : '纠错 fact#' + c.fact_id + ' → 新值 ' + c.new_value + '（版本 ' + c.version + '）'}</div>`).join('') +
      data.reminders.map(r => `<div class="fact">⏰ 提醒：${r.quote}${r.due_at ? '（' + r.due_at + '）' : '（待补时间）'}</div>`).join('') +
      data.care_requests.map(c => `<div class="fact">📋 ${c.title}：<br><span class="msg assistant">${c.summary}</span></div>`).join('') +
      data.held_segments.map(h => `<div class="held">⚠️ 归属未知：${h.quote}</div>`).join('') +
      (data.answer ? `<div class="msg assistant">${data.answer}</div>` : '');
    $('text').value = ''; loadHistory();
  } catch (e) { $('result').innerHTML = `<div class="err">${e.code}: ${e.message}</div>`; }
}
async function loadHistory() {
  const data = await api('/messages');
  $('history').innerHTML = data.messages.map(m => `<div class="msg ${m.role}">${m.content}</div>`).join('') || '';
}
async function loadFacts() {
  const data = await api('/facts');
  $('history').innerHTML = data.facts.map(f => `<div class="fact">「${f.pet_name}」${f.topic || ''}${f.value != null ? ' ' + f.value : ''}${f.unit || ''}（出处：${f.quote}）</div>`).join('') || '（暂无记录）';
}
async function loadHeld() {
  const data = await api('/held');
  $('history').innerHTML = data.held_segments.map(h => `<div class="held">⚠️ 归属未知：${h.quote}</div>`).join('') || '（暂无挂起）';
}
async function loadReminders() {
  const data = await api('/reminders');
  $('history').innerHTML = data.reminders.map(r =>
    `<div class="fact">⏰ ${r.pet_name ? '「'+r.pet_name+'」' : ''} ${r.quote}<br>到期：${r.due_at || '待补时间'}｜状态：${r.status}${r.is_due ? '（已到期）' : ''} <button class="ghost" onclick="remAction(${r.id},'complete')">完成</button><button class="ghost" onclick="remAction(${r.id},'pause')">暂停</button><button class="ghost" onclick="remAction(${r.id},'cancel')">取消</button></div>`
  ).join('') || '（暂无提醒）';
}
async function remAction(id, action) {
  await api(`/reminders/${id}/${action}`, { method: 'POST' });
  loadReminders();
}
async function uploadPhoto() {
  const file = $('photoFile').files[0]; if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('description', $('photoDesc').value);
  const r = await fetch('/api/photos', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd });
  const data = await r.json();
  if (!r.ok) { $('history').innerHTML = `<div class="err">${data.error.code}: ${data.error.message}</div>`; return; }
  $('photoFile').value = ''; $('photoDesc').value = '';
  loadPhotos();
}
async function loadPhotos() {
  const data = await api('/photos');
  $('history').innerHTML = data.photos.map(p => `<div class="fact">🖼️ ${p.pet_name ? '「'+p.pet_name+'」' : ''} ${p.filename}${p.description ? '：'+p.description : ''}</div>`).join('') || '（暂无照片）';
}
async function loadCare() {
  const data = await api('/care-summaries');
  $('history').innerHTML = data.care_summaries.map(c =>
    `<div class="fact">📋 【${c.pet_name}】${c.title}<br><span class="msg assistant">${c.summary}</span><br><button class="ghost" onclick="simulateReply(${c.id})">模拟医院回复</button></div>`
  ).join('') || '（暂无摘要）';
}
async function simulateReply(id) {
  const data = await api(`/care-summaries/${id}/simulate-reply`, { method: 'POST' });
  $('history').innerHTML = `<div class="held">${data.reply}</div>` + $('history').innerHTML;
}
if (token) {
  (async () => {
    try { await api('/pets'); showApp(); }
    catch (e) { /* api() 已自动回到登录页 */ }
  })();
}
</script>
</body>
</html>
